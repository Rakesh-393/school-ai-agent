<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramita Schools Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #1c2128;
    --muted: #6b7480; --accent: #2f6f4f; --accent-soft: #e8f1ec;
  }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  .wrap { max-width: 780px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header .sub { font-size: 12px; color: var(--muted); font-weight: 400; }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
                   border-radius: 7px; background: #fff; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .bot  { align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
          border-bottom-left-radius: 3px; }
  .bot table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .bot th, .bot td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  .trace { font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 7px;
           border-top: 1px dashed var(--line); font-family: ui-monospace, Consolas, monospace; }
  .trace .bad { color: #b4553b; }
  .msg.err { background: #fdf2ef; border-color: #e6c4b8; color: #8a3d24; }
  .chips { padding: 0 18px 10px; display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { font-size: 12.5px; padding: 5px 11px; border-radius: 14px;
          background: var(--accent-soft); border: 1px solid #cfe0d6; color: #2c5a44; }
  form { display: flex; gap: 8px; padding: 12px 18px; background: var(--panel);
         border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; padding: 10px 13px; border: 1px solid var(--line);
                     border-radius: 8px; font: inherit; }
  select.question-picker { max-width: 190px; padding: 10px 8px; color: var(--muted); }
  button.send { background: var(--accent); color: #fff; border-color: var(--accent); padding: 10px 18px; }
  .phone { color: var(--accent); border-color: #cfe0d6; text-decoration: none; padding: 6px 10px;
           border-radius: 7px; white-space: nowrap; }
  .voice { min-width: 44px; padding: 10px; }
  .voice.listening { background: #f8e5df; border-color: #d88b75; color: #8a3d24; }
  .voice-status { min-height: 20px; padding: 0 18px 8px; color: var(--muted); font-size: 12px; }
  .welcome { display: flex; gap: 10px; align-items: flex-start; }
  .welcome strong { color: var(--accent); }
  .recording-popup { position: fixed; inset: 0; display: none; place-items: center;
                     background: rgba(28, 33, 40, .38); z-index: 10; }
  .recording-popup.show { display: grid; }
  .recording-card { width: min(340px, calc(100vw - 36px)); padding: 26px; text-align: center;
                    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
                    box-shadow: 0 18px 45px rgba(28, 33, 40, .2); }
  .recording-icon { font-size: 42px; line-height: 1; margin-bottom: 12px; }
  .recording-card h2 { margin: 0 0 6px; font-size: 18px; }
  .recording-card p { margin: 0 0 18px; color: var(--muted); }
  .stop-recording { background: #8a3d24; color: #fff; border-color: #8a3d24; }
  button:disabled { opacity: .55; cursor: default; }
  .dots::after { content: '.'; animation: d 1.2s steps(4,end) infinite; }
  @keyframes d { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Paramita Schools Assistant<br><span class="sub">Flask &middot; RAG &middot; tool-calling agent</span></h1>
    <a class="phone" href="tel:{{ office_phone|replace(' ', '')|replace('/', '') }}" title="Call the school office">Call office</a>
    <select id="role" title="Changes which tools the agent may call">
      <option value="parent">Parent</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>
    <button id="reset" title="Clear conversation">Reset</button>
  </header>

  <div id="log">
    <div class="msg bot welcome"><span aria-hidden="true">&#128075;</span><div><strong>Hello, welcome to Paramita Schools.</strong><br>I can help with campuses, attendance, marks, fees, homework, timetables, and school policies.</div></div>
  </div>

  <form id="form">
    <input type="text" id="q" placeholder="Ask a question..." autocomplete="off" required>
    <select class="question-picker" id="questionPicker" title="Choose a suggested question">
      <option value="">Suggested questions</option>
      <option>How many branches do you have?</option>
      <option>Which branch is CBSE?</option>
      <option>Tell me about the Explorica campus</option>
      <option>Kabir Menon's attendance this month</option>
      <option>Any pending fees for Diya Patel?</option>
      <option>What is the leave policy?</option>
      <option>Homework for 7A at Heritage</option>
    </select>
    <button class="voice" id="voice" type="button" title="Speak your question" aria-label="Speak your question">&#127908;</button>
    <button class="send" type="submit">Send</button>
  </form>
  <div class="voice-status" id="voiceStatus" role="status" aria-live="polite"></div>
</div>

<div class="recording-popup" id="recordingPopup" role="dialog" aria-modal="true" aria-labelledby="recordingTitle">
  <div class="recording-card">
    <div class="recording-icon" aria-hidden="true">&#127911;</div>
    <h2 id="recordingTitle">Recording your question</h2>
    <p id="recordingText">Speak clearly, then press Stop or Enter.</p>
    <button class="stop-recording" id="stopRecording" type="button">Stop recording</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const q = document.getElementById('q');
const roleSel = document.getElementById('role');
const voice = document.getElementById('voice');
const questionPicker = document.getElementById('questionPicker');
const voiceStatus = document.getElementById('voiceStatus');
const recordingPopup = document.getElementById('recordingPopup');
const stopRecording = document.getElementById('stopRecording');

questionPicker.onchange = () => {
  if (questionPicker.value) {
    q.value = questionPicker.value;
    q.focus();
    questionPicker.value = '';
  }
};

let recorder = null;
let recording = [];
function closeRecordingPopup() {
  recordingPopup.classList.remove('show');
}

stopRecording.onclick = () => {
  if (recorder && recorder.state === 'recording') recorder.stop();
};

voice.onclick = async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    voiceStatus.textContent = 'Audio recording is not supported in this browser.';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream);
    recording = [];
    recorder.ondataavailable = event => { if (event.data.size) recording.push(event.data); };
    recorder.onstart = () => {
      voice.classList.add('listening');
      voice.textContent = String.fromCodePoint(0x1F3A7);
      voiceStatus.textContent = 'Recording... click the microphone again when finished.';
      recordingPopup.classList.add('show');
      stopRecording.focus();
    };
    recorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());
      voice.classList.remove('listening');
      voice.textContent = String.fromCodePoint(0x1F3A7);
      closeRecordingPopup();
      voiceStatus.textContent = 'Converting your voice to text...';
      const formData = new FormData();
      formData.append('audio', new Blob(recording, {type: recorder.mimeType}), 'question.webm');
      try {
        const response = await fetch('/api/transcribe', {method: 'POST', body: formData});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Transcription failed.');
        q.value = data.text;
        q.focus();
        voiceStatus.textContent = 'Voice converted. Press Send when ready.';
      } catch (error) {
        voiceStatus.textContent = error.message;
      }
    };
    recorder.start();
  } catch (error) {
    voiceStatus.textContent = 'Microphone access was blocked. Allow access and try again.';
  }
};

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// Minimal markdown: tables, bold, inline code. Enough for the agent's output.
function render(md){
  let h = esc(md);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
       .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = h.split('\n');
  let out = [], tbl = null;
  for (const line of lines){
    if (/^\s*\|.*\|\s*$/.test(line)){
      const cells = line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if (cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;   // separator row
      if (!tbl){ tbl = '<table><tr>'+cells.map(c=>`<th>${c}</th>`).join('')+'</tr>'; }
      else { tbl += '<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'; }
    } else {
      if (tbl){ out.push(tbl+'</table>'); tbl = null; }
      out.push(line);
    }
  }
  if (tbl) out.push(tbl+'</table>');
  return out.join('\n');
}

function bubble(text, who, trace, actions){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = who === 'bot' ? render(text) : esc(text);
  if (trace && trace.length){
    const t = document.createElement('div');
    t.className = 'trace';
    t.innerHTML = trace.map(s =>
      `<span class="${s.ok?'':'bad'}">${s.ok?'&#10003;':'&#10007;'} ${esc(s.tool)}(${esc(JSON.stringify(s.args))})</span>`
    ).join('<br>');
    d.appendChild(t);
  }
  if (actions && actions.length){
    const a = document.createElement('div');
    a.className = 'chips';
    actions.forEach(action => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = action.label;
      b.onclick = () => send(action.message);
      a.appendChild(b);
    });
    d.appendChild(a);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function send(text){
  bubble(text, 'user');
  const pending = bubble('thinking', 'bot');
  pending.innerHTML = '<span class="dots">thinking</span>';
  form.querySelector('.send').disabled = true;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text, role: roleSel.value })
    });
    const data = await r.json();
    pending.remove();
    if (data.error) {
      const b = bubble(data.error + (data.fix ? '\n\n' + data.fix : ''), 'bot');
      b.classList.add('err');
    } else {
      bubble(data.answer, 'bot', null, data.actions);
    }
  } catch (e) {
    pending.remove();
    bubble('Network error: ' + e.message, 'bot');
  } finally {
    form.querySelector('.send').disabled = false;
    q.focus();
  }
}

form.onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (t){ q.value=''; send(t); } };
document.onkeydown = event => {
  if (event.key === 'Enter' && recorder && recorder.state === 'recording') {
    event.preventDefault();
    recorder.stop();
  }
};
document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', {method:'POST'});
  log.innerHTML = '<div class="msg bot">Conversation cleared.</div>';
};
</script>
</body>
</html>
