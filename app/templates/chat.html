<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  :root {
      --bg: #eef5f0; --panel: #fff; --line: #d8e2db; --ink: #202923;
      --muted: #68756d; --accent: #2f7650; --accent-dark: #245c3d;
      --accent-soft: #edf6f0;
  }
  * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 0%, #fff 0 16%, transparent 42%), var(--bg); color: var(--ink); }
    .wrap { width: min(100%, 780px); margin: 24px auto; height: calc(100vh - 48px); min-height: 560px;
       display: flex; flex-direction: column; background: var(--panel); border: 1px solid #d8d0da;
       border-radius: 13px; overflow: hidden; box-shadow: 0 20px 55px rgba(74, 37, 69, .12); }
    header { padding: 15px 18px; color: #fff; background: var(--accent); display: flex; align-items: center; gap: 11px; }
    header h1 { font-size: 15px; line-height: 1.25; margin: 0; flex: 1; }
    header .sub { display: block; margin-top: 3px; font-size: 11px; color: #f8dff0; font-weight: 400; }
    .brand-avatar { width: 35px; height: 35px; display: grid; place-items: center; border: 2px solid #fff;
          border-radius: 50%; background: #f5d7eb; color: var(--accent-dark); font-weight: 700; }
    .online { width: 8px; height: 8px; margin-left: -17px; margin-top: 25px; border: 2px solid var(--accent);
         border-radius: 50%; background: #42c58a; z-index: 1; }
    select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
           border-radius: 7px; background: #fff; cursor: pointer; }
    header select { max-width: 98px; padding: 5px 6px; border: 0; color: #5e2750; }
    .header-icon { padding: 4px 8px; border: 0; background: transparent; color: #fff; font-size: 20px; }
    #log { flex: 1; overflow-y: auto; padding: 24px 16px 10px; display: flex; flex-direction: column; gap: 9px; }
    .msg { max-width: 88%; padding: 9px 13px; border-radius: 10px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
    .bot  { align-self: flex-start; background: #f3f1f2; border: 0; border-bottom-left-radius: 3px; }
    .bot.reply { display: flex; gap: 9px; align-items: flex-start; background: transparent; padding: 0; }
    .reply-avatar { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto;
                    border-radius: 50%; background: #f4d5e8; color: var(--accent-dark); font-weight: 700; }
    .reply-body { max-width: calc(100% - 37px); padding: 9px 13px; background: #edf2ee; border-radius: 10px;
                  border-bottom-left-radius: 3px; }
  .bot table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .bot th, .bot td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  .trace { font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 7px;
           border-top: 1px dashed var(--line); font-family: ui-monospace, Consolas, monospace; }
  .trace .bad { color: #b4553b; }
  .msg.err { background: #fdf2ef; border-color: #e6c4b8; color: #8a3d24; }
    .quick-actions { display: flex; gap: 7px; flex-wrap: wrap; margin: 3px 0 9px 37px; }
    .chip { font-size: 12px; padding: 7px 10px; border-radius: 8px;
      background: #fff; border: 1px solid #90aa99; color: var(--accent-dark); }
    form { display: flex; align-items: center; gap: 7px; margin: 8px 16px 7px; padding: 4px 7px 4px 14px;
     background: var(--panel); border: 1px solid #bcb5bd; border-radius: 25px; }
    input[type=text] { flex: 1; min-width: 0; padding: 9px 0; border: 0; outline: 0; font: inherit; }
    select.question-picker { width: 100%; padding: 5px 0; color: var(--accent-dark); border: 0;
                 background: #fff; outline: 0; }
    button.send { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: #fff; }
    .phone { color: #fff; border: 0; text-decoration: none; padding: 5px; white-space: nowrap; font-size: 0; }
    .phone::before { content: '\260E'; font-size: 18px; }
    .voice { min-width: 34px; height: 34px; padding: 5px; border: 1px solid #90aa99;
             border-radius: 50%; background: #edf6f0; color: var(--accent-dark); }
    .voice:hover { background: #dff2e6; border-color: var(--accent); }
  .voice.listening { background: #dff2e6; border: 2px solid var(--accent); color: var(--accent-dark);
                     box-shadow: 0 0 0 5px rgba(47, 118, 80, .16); animation: headphonePulse 1s ease-in-out infinite; }
  .voice-status { min-height: 20px; padding: 0 18px 5px; color: var(--muted); font-size: 11px; text-align: center; }
  .welcome { display: flex; gap: 9px; align-items: flex-start; background: transparent; padding: 0; }
  .welcome strong { color: var(--ink); }
  .welcome-avatar { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto;
                    border-radius: 50%; background: #f4d5e8; color: var(--accent-dark); font-weight: 700; }
  .welcome-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .welcome-online { color: #29945b; font-size: 9px; font-weight: 600; }
  .welcome-copy { max-width: 295px; align-self: flex-start; margin-top: -41px; }
  .welcome-copy p { margin: 0; padding: 9px 13px; background: #edf2ee; border-radius: 10px; }
  .recording-popup { position: fixed; inset: 0; display: none; place-items: center;
                     background: rgba(28, 33, 40, .38); z-index: 10; }
  .recording-popup.show { display: grid; }
  .recording-card { width: min(340px, calc(100vw - 36px)); padding: 26px; text-align: center;
                    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
                    box-shadow: 0 18px 45px rgba(28, 33, 40, .2); }
  .recording-icon { font-size: 48px; line-height: 1; margin-bottom: 10px; color: var(--accent-dark);
                    animation: headphoneBounce .8s ease-in-out infinite alternate; }
  .recording-wave { height: 30px; display: flex; justify-content: center; align-items: center; gap: 5px; margin: 4px 0 14px; }
  .recording-wave span { width: 5px; height: 10px; border-radius: 4px; background: var(--accent);
                         animation: recordingBars .75s ease-in-out infinite alternate; }
  .recording-wave span:nth-child(2) { animation-delay: .12s; }
  .recording-wave span:nth-child(3) { animation-delay: .24s; }
  .recording-wave span:nth-child(4) { animation-delay: .36s; }
  .recording-wave span:nth-child(5) { animation-delay: .48s; }
  .recording-card h2 { margin: 0 0 6px; font-size: 18px; }
  .recording-card p { margin: 0 0 18px; color: var(--muted); }
  .stop-recording { background: #8a3d24; color: #fff; border-color: #8a3d24; }
  button:disabled { opacity: .55; cursor: default; }
  .dots::after { content: '.'; animation: d 1.2s steps(4,end) infinite; }
  @keyframes d { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
  @keyframes headphonePulse { 50% { transform: scale(1.08); } }
  @keyframes headphoneBounce { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
  @keyframes recordingBars { from { height: 7px; transform: translateY(5px); } to { height: 28px; transform: translateY(-5px); } }
  @media (max-width: 560px) {
    .wrap { width: 100%; height: 100vh; min-height: 0; margin: 0; border: 0; border-radius: 0; }
    header { padding: 13px 12px; }
    header select { max-width: 78px; }
    #log { padding-left: 12px; padding-right: 12px; }
    form { margin-left: 10px; margin-right: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-avatar">P</div><span class="online" aria-label="Online"></span>
    <h1>{{ page.title }}<span class="sub">Online &middot; {{ page.subtitle }}</span></h1>
    <a class="phone" href="tel:{{ office_phone|replace(' ', '')|replace('/', '') }}" title="Call the school office">Call office</a>
    <select id="role" title="Changes which tools the agent may call">
      {% for value, label in roles %}
      <option value="{{ value }}"{% if value == default_role %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <button class="header-icon" id="reset" title="Clear conversation" aria-label="Clear conversation">&#8635;</button>
    <button class="header-icon" title="Close chat" aria-label="Close chat">&times;</button>
  </header>

  <div id="log">
    <div class="msg bot welcome"><div class="welcome-avatar-wrap"><div class="welcome-avatar">P</div><span class="welcome-online">Online</span></div><div class="welcome-copy">
      <p><strong>&#128075; {{ page.welcome }}</strong><br>How can I help you today? &#128522;</p>
    </div></div>
    <div class="quick-actions">
      {% for label, message in page.chips %}
      <button class="chip" type="button" onclick="send({{ message|tojson|forceescape }})">{{ label }}</button>
      {% endfor %}
    </div>
  </div>

  <form id="form">
    <input type="text" id="q" placeholder="Ask a question..." autocomplete="off" required>
    <button class="voice" id="voice" type="button" title="Record your question" aria-label="Record your question">&#127911;</button>
    <button class="send" type="submit" title="Send question" aria-label="Send question">&#9654;</button>
  </form>
  <div class="voice-status" id="voiceStatus" role="status" aria-live="polite"></div>
</div>

<div class="recording-popup" id="recordingPopup" role="dialog" aria-modal="true" aria-labelledby="recordingTitle">
  <div class="recording-card">
    <div class="recording-icon" aria-hidden="true">&#127911;</div>
    <div class="recording-wave" aria-label="Recording in progress">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <h2 id="recordingTitle">Recording your question</h2>
    <p id="recordingText">Speak clearly, then press Stop or Enter.</p>
    <button class="stop-recording" id="stopRecording" type="button">Stop recording</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const q = document.getElementById('q');
const roleSel = document.getElementById('role');
const voice = document.getElementById('voice');
const voiceStatus = document.getElementById('voiceStatus');
const recordingPopup = document.getElementById('recordingPopup');
const stopRecording = document.getElementById('stopRecording');

let recorder = null;
let recording = [];
function closeRecordingPopup() {
  recordingPopup.classList.remove('show');
}

stopRecording.onclick = () => {
  if (recorder && recorder.state === 'recording') recorder.stop();
};

voice.onclick = async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    voiceStatus.textContent = 'Audio recording is not supported in this browser.';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream);
    recording = [];
    recorder.ondataavailable = event => { if (event.data.size) recording.push(event.data); };
    recorder.onstart = () => {
      voice.classList.add('listening');
      voice.textContent = String.fromCodePoint(0x1F3A7);
      voiceStatus.textContent = 'Recording... click the microphone again when finished.';
      recordingPopup.classList.add('show');
      stopRecording.focus();
    };
    recorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());
      voice.classList.remove('listening');
      voice.textContent = String.fromCodePoint(0x1F3A7);
      closeRecordingPopup();
      voiceStatus.textContent = 'Converting your voice to text...';
      const formData = new FormData();
      formData.append('audio', new Blob(recording, {type: recorder.mimeType}), 'question.webm');
      try {
        const response = await fetch('/api/transcribe', {method: 'POST', body: formData});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Transcription failed.');
        q.value = data.text;
        q.focus();
        voiceStatus.textContent = 'Voice converted. Press Send when ready.';
      } catch (error) {
        voiceStatus.textContent = error.message;
      }
    };
    recorder.start();
  } catch (error) {
    voiceStatus.textContent = 'Microphone access was blocked. Allow access and try again.';
  }
};

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// Minimal markdown: tables, bold, inline code. Enough for the agent's output.
function render(md){
  let h = esc(md);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
       .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = h.split('\n');
  let out = [], tbl = null;
  for (const line of lines){
    if (/^\s*\|.*\|\s*$/.test(line)){
      const cells = line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if (cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;   // separator row
      if (!tbl){ tbl = '<table><tr>'+cells.map(c=>`<th>${c}</th>`).join('')+'</tr>'; }
      else { tbl += '<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'; }
    } else {
      if (tbl){ out.push(tbl+'</table>'); tbl = null; }
      out.push(line);
    }
  }
  if (tbl) out.push(tbl+'</table>');
  return out.join('\n');
}

function bubble(text, who, trace, actions){
  const d = document.createElement('div');
  d.className = 'msg ' + who + (who === 'bot' ? ' reply' : '');
  const body = who === 'bot' ? document.createElement('div') : d;
  if (who === 'bot') {
    const avatar = document.createElement('div');
    avatar.className = 'reply-avatar';
    avatar.textContent = 'P';
    d.appendChild(avatar);
    body.className = 'reply-body';
    d.appendChild(body);
  }
  body.innerHTML = who === 'bot' ? render(text) : esc(text);
  if (trace && trace.length){
    const t = document.createElement('div');
    t.className = 'trace';
    // A job shows as its plan: the goal, then each step the model chose, with
    // why it chose it. A plain question shows the single tool, as before.
    t.innerHTML = trace.map(s => {
      const mark = s.ok ? '&#10003;' : '&#10007;';
      if (s.tool === 'make_plan') {
        return s.ok
          ? `<strong>Plan: ${esc(s.result.goal)}</strong>`
          : `<span class="bad">${mark} plan not used: ${esc(s.result.message || '')}</span>`;
      }
      if (s.planned) {
        return `<span class="${s.ok?'':'bad'}">&nbsp;&nbsp;${s.planned}. ${mark} ${esc(s.why || s.tool)}`
             + ` <span style="opacity:.7">(${esc(s.tool)})</span></span>`;
      }
      return `<span class="${s.ok?'':'bad'}">${mark} ${esc(s.tool)}(${esc(JSON.stringify(s.args))})</span>`;
    }).join('<br>');
    body.appendChild(t);
  }
  if (actions && actions.length){
    const a = document.createElement('div');
    a.className = 'chips';
    actions.forEach(action => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = action.label;
      b.onclick = () => send(action.message);
      a.appendChild(b);
    });
    body.appendChild(a);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function send(text){
  bubble(text, 'user');
  const pending = bubble('typing', 'bot');
  pending.querySelector('.reply-body').innerHTML = '<span class="dots">typing</span>';
  form.querySelector('.send').disabled = true;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text, role: roleSel.value })
    });
    const data = await r.json();
    pending.remove();
    if (data.error) {
      const b = bubble(data.error + (data.fix ? '\n\n' + data.fix : ''), 'bot');
      b.classList.add('err');
    } else {
      bubble(data.answer, 'bot', null, data.actions);
    }
  } catch (e) {
    pending.remove();
    bubble('Network error: ' + e.message, 'bot');
  } finally {
    form.querySelector('.send').disabled = false;
    q.focus();
  }
}

form.onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (t){ q.value=''; send(t); } };
document.onkeydown = event => {
  if (event.key === 'Enter' && recorder && recorder.state === 'recording') {
    event.preventDefault();
    recorder.stop();
  }
};
document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', {method:'POST'});
  log.innerHTML = '<div class="msg bot">Conversation cleared.</div>';
};
</script>
</body>
</html>
